[package]
name = "cleandlwin"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Windows client for CleanDL"
repository = "https://github.com/chevybeef/cleandlwin"
readme = "README.md"
build = "build.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
dirs-next = "2"
filetime = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-core = "0.100"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
